<body>
  <button type="button" class="skip-link" id="skipLink">Skip to content</button>
  <header class="top">

      <a class="brand" href="#/" aria-label="Learn Braille home">

        <span class="brand-wm"><span class="wm-l">L</span>earn <span class="wm-b">B</span>raille</span>
      </a>
      <span class="head-title" id="headTitle" role="heading" aria-level="1"></span>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-route="">Home</a>
        <a href="#/reference" data-route="reference">Learn</a>
        <a href="#/practice" data-route="practice">Practice</a>
        <a href="#/games" data-route="games">Games</a>
        <a href="#/translate" data-route="translate">Translate</a>
      </nav>
      <button class="icon-btn plain" id="peekBtn" aria-label="Peek at the cheat sheet" title="Peek at the cheat sheet" data-icon="peek" hidden></button>

      <button class="icon-btn plain" id="searchBtn" aria-label="Search" title="Search" data-icon="search"></button>
      <button class="icon-btn plain" id="settingsBtn" aria-label="Settings" title="Settings" data-icon="settings"></button>
    </div>
    <div class="subbar" id="subbar" hidden></div>
  </header>
  <div class="search-ov" id="searchOv" hidden>

    </div>

  <main id="view" tabindex="-1"></main>
  <div id="srLive" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-route="" data-icon="home">Home</a>
    <a href="#/reference" data-route="reference" data-icon="book">Learn</a>
    <a href="#/practice" data-route="practice" data-icon="practice">Practice</a>
    <a href="#/games" data-route="games" data-icon="games">Games</a>
    <a href="#/translate" data-route="translate" data-icon="translate">Translate</a>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
