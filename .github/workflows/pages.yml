name: Test and deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Translator checks
        run: node --test tests/translator.test.mjs tests/readbraille.test.mjs
      - name: Pre-UEB examples match liblouis EBAE
        run: sudo apt-get update -q && sudo apt-get install -y liblouis-bin liblouis-data && node --test tests/preueb.test.mjs
      - name: Install Playwright
        run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Every route loads without errors
        run: node tests/smoke.mjs
      - name: Search overlay
        run: node tests/search.mjs

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version (the app shows "Updated" when this changes)
        run: echo "{\"v\":\"${GITHUB_SHA::7}\"}" > site/version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages sometimes reports "No artifacts named github-pages" right after the upload
      # (GitHub's artifact listing lags behind). Wait and try once more before failing the run.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
